plugins {
    id 'java'
    id 'net.neoforged.gradle.forge' version '6.0.11'
}

version = '1.0.0'
group = 'com.example.shadermod'

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings(loom, "1.20.4")
    runs {
        create("client") {
            client()
        }
        create("server") {
            server()
        }
    }
}

neoforge {
    version = '20.4.167'
    runConfig = 'client'
}

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
